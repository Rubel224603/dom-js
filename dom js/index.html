<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dom Practice</title>
    <script src="script.js"></script>
</head>
<body>
    <h1 id="heading">Hello Bangladesh</h1>
    <p id="paraText"></p>
    <button id="btn">click</button>
    <input type="text" id="firstNumber">
    <input type="text" id="lastNumber">
    <input type="button" id="sumBtn" value="SUM">

    <button  id="clcikMe">Click Me</button>
    <p  id="jstClick">Just Click</p>
    <p id="showResut"></p>

    <script>

        //alert('hello');
        document.getElementById('btn').onclick=(function(){
           $show = document.getElementById('heading').innerText="Siam is  a Js Expert";
           document.write(show);
        });

        document.getElementById('sumBtn').onclick=(function(){
            var firstNumber = document.getElementById('firstNumber').value;
            var lastNumber = document.getElementById('lastNumber').value;
            var sum = firstNumber + lastNumber;
            alert(sum);
        });
        
       // document.getElementById('heading').innerHTML="I am Rubel";
        document.getElementById('heading').innerText += "I am Rubel";
        document.getElementById('paraText').innerText= "Hell paragraphp it's from Dom";


       document.getElementById('clcikMe').addEventListener('click',add);
        

        function add(){
            let a= 50;
            let b=10;
            let sum = a+b;
            alert(sum);
        }

        document.getElementById('jstClick').addEventListener('click',show);

        function show(){
            document.getElementById("showResut").innerHTML= "<h1>Yes I am Result</h1>";
        }

       


    </script>
</body>
</html>
